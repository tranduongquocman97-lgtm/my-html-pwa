<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HTML Reader & Runner</title>

  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Hỗ trợ iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HTMLReader">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1e293b;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #60a5fa;
    }
    .install-btn {
      display: none;
      background: #10b981;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar label, .toolbar button {
      background: #2563eb;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
    }
    .toolbar input[type="file"] {
      display: none;
    }
    .preview-box {
      flex: 1;
      min-height: 400px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
    #update-toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #1e293b;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 9999px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border: 1px solid #3b82f6;
      font-size: 13px;
      z-index: 9999;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    #update-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>HTML Reader</h1>
    <button id="pwa-install" class="install-btn">Cài đặt ứng dụng</button>
  </header>

  <div class="main-container">
    <div class="toolbar">
      <label>
        Chọn file HTML từ máy
        <input type="file" id="html-file-input" accept=".html,text/html">
      </label>
      <button id="btn-sample">Nạp mã mẫu</button>
    </div>

    <div class="preview-box">
      <iframe id="app-viewport" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
    </div>
  </div>

  <div id="update-toast">
    <span>Có phiên bản mới!</span>
    <button id="update-btn">Cập nhật ngay</button>
  </div>

  <script>
    const fileInput = document.getElementById('html-file-input');
    const viewport = document.getElementById('app-viewport');
    const sampleBtn = document.getElementById('btn-sample');
    const installBtn = document.getElementById('pwa-install');

    // Nạp mã HTML mẫu
    function loadSample() {
      const sampleCode = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            body { font-family: sans-serif; padding: 20px; text-align: center; }
            button { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 16px; margin-top: 10px; }
          </style>
        </head>
        <body>
          <h2>Mã HTML đang chạy mượt mà!</h2>
          <p>Trang này hoạt động độc lập và hoàn toàn ngoại tuyến.</p>
          <button onclick="alert('JavaScript hoạt động chuẩn xác!')">Bấm thử</button>
        </body>
        </html>
      `;
      viewport.srcdoc = sampleCode;
    }
    sampleBtn.addEventListener('click', loadSample);
    loadSample();

    // Mở file HTML từ máy
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        viewport.srcdoc = event.target.result;
      };
      reader.readAsText(file);
    });

    // 1. Bắt sự kiện cài đặt PWA (Android / Chrome)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    // 2. Đăng ký Service Worker
    if ('serviceWorker' in navigator) {
      let newWorker;
      let refreshing = false;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();
          reg.addEventListener('updatefound', () => {
            newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                const toast = document.getElementById('update-toast');
                const btn = document.getElementById('update-btn');
                toast.style.display = 'flex';
                btn.addEventListener('click', () => {
                  newWorker.postMessage({ action: 'skipWaiting' });
                  toast.style.display = 'none';
                });
              }
            });
          });
        });
      });
    }
  </script>
</body>
</html>
