<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HTML Reader & Runner</title>

  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Hỗ trợ iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HTMLReader">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Chiều cao thực tế trên mọi màn hình di động */
      overflow: hidden; /* Chặn cuộn ngoài khung app */
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Container chính chia layout đứng */
    .app-root {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* Thanh điều khiển trên cùng */
    header.toolbar {
      background-color: #1e293b;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
      z-index: 10;
      transition: all 0.25s ease;
    }

    header.toolbar.hidden {
      display: none;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: #2563eb;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .btn:active {
      background: #1d4ed8;
    }

    .btn-success {
      background: #10b981;
    }
    .btn-success:active {
      background: #059669;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
    }

    input[type="file"] {
      display: none;
    }

    /* Khung chứa iframe chiếm trọn vẹn phần còn lại */
    .viewport-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }

    /* Iframe căng 100% tuyệt đối */
    iframe#app-viewport {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* Nút nổi bật mở lại thanh công cụ khi đã ẩn */
    #toggle-toolbar-btn {
      position: fixed;
      bottom: 14px;
      right: 14px;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(4px);
      color: #94a3b8;
      border: 1px solid #475569;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999;
      font-size: 16px;
    }

    /* Toast thông báo cập nhật */
    #update-toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #1e293b;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 9999px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border: 1px solid #3b82f6;
      font-size: 13px;
      z-index: 1000;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="app-root">
    <!-- Header điều khiển -->
    <header class="toolbar" id="main-toolbar">
      <div class="btn-group">
        <label class="btn">
          📂 Chọn file HTML
          <input type="file" id="html-file-input" accept=".html,text/html">
        </label>
        <button class="btn btn-outline" id="btn-reload">🔄 Tải lại</button>
      </div>

      <div class="btn-group">
        <button id="pwa-install" class="btn btn-success" style="display: none;">⬇ Cài đặt App</button>
        <button class="btn btn-outline" id="btn-hide-bar" title="Ẩn thanh này để xem toàn màn hình">Toàn màn hình ⛶</button>
      </div>
    </header>

    <!-- Khu vực hiển thị file HTML nội bộ -->
    <main class="viewport-container">
      <iframe 
        id="app-viewport" 
        sandbox="allow-scripts allow-modals allow-same-origin allow-forms allow-downloads allow-popups"
        allow="fullscreen; clipboard-read; clipboard-write">
      </iframe>
    </main>
  </div>

  <!-- Nút tròn góc phải để bật/tắt thanh công cụ khi cần -->
  <button id="toggle-toolbar-btn" title="Hiện/Ẩn Menu">⚙</button>

  <!-- Banner thông báo cập nhật PWA -->
  <div id="update-toast">
    <span>Có phiên bản mới!</span>
    <button class="btn btn-success" style="padding: 4px 10px; font-size: 12px;" id="update-btn">Cập nhật ngay</button>
  </div>

  <script>
    const fileInput = document.getElementById('html-file-input');
    const viewport = document.getElementById('app-viewport');
    const reloadBtn = document.getElementById('btn-reload');
    const hideBarBtn = document.getElementById('btn-hide-bar');
    const toggleBtn = document.getElementById('toggle-toolbar-btn');
    const toolbar = document.getElementById('main-toolbar');
    const installBtn = document.getElementById('pwa-install');

    let currentHtmlContent = "";

    // 1. Lưu và nạp nội dung file HTML
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        currentHtmlContent = event.target.result;
        // Lưu vào sessionStorage để khi reload không bị mất nội dung vừa nạp
        try {
          sessionStorage.setItem('last_loaded_html', currentHtmlContent);
        } catch(err) {}
        
        renderHtml(currentHtmlContent);
      };
      reader.readAsText(file);
    });

    function renderHtml(content) {
      viewport.srcdoc = content;
    }

    // Tự nạp lại dữ liệu cũ nếu trước đó người dùng đã chọn file
    const cachedHtml = sessionStorage.getItem('last_loaded_html');
    if (cachedHtml) {
      currentHtmlContent = cachedHtml;
      renderHtml(currentHtmlContent);
    }

    // Nút tải lại (Reload lại nội dung trong iframe)
    reloadBtn.addEventListener('click', () => {
      if (currentHtmlContent) {
        renderHtml(currentHtmlContent);
      } else {
        viewport.contentWindow.location.reload();
      }
    });

    // 2. Ẩn/Hiện thanh công cụ để lấy không gian toàn màn hình
    function toggleToolbar() {
      toolbar.classList.toggle('hidden');
    }
    hideBarBtn.addEventListener('click', toggleToolbar);
    toggleBtn.addEventListener('click', toggleToolbar);

    // 3. Xử lý sự kiện cài đặt PWA
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-flex';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    // 4. Quản lý Service Worker
    if ('serviceWorker' in navigator) {
      let newWorker;
      let refreshing = false;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();
          reg.addEventListener('updatefound', () => {
            newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                const toast = document.getElementById('update-toast');
                const btn = document.getElementById('update-btn');
                toast.style.display = 'flex';
                btn.addEventListener('click', () => {
                  newWorker.postMessage({ action: 'skipWaiting' });
                  toast.style.display = 'none';
                });
              }
            });
          });
        });
      });
    }
  </script>
</body>
</html>
